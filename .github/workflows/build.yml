name: build-and-host-tests
on: [push, pull_request]
jobs:
  host:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy safetensors 'transformers>=4.40,<5' torch
      - run: cmake -S . -B build -DLLM_CUDA=OFF -DCMAKE_BUILD_TYPE=Debug -DLLM_SANITIZE=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
  cuda-compile:
    runs-on: ubuntu-22.04
    container: nvidia/cuda:12.6.3-devel-ubuntu22.04
    steps:
      - run: apt-get update && apt-get install -y git build-essential python3-pip
      - uses: actions/checkout@v4
      - run: python3 -m pip install 'cmake>=3.24,<4'
      - run: cmake -S . -B build -DLLM_CUDA=ON -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      # Standard hosted runners do not expose NVIDIA GPUs. No runtime pass is claimed.
