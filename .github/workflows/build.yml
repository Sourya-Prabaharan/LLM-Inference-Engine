name: build-and-host-tests
on: [push, pull_request]
jobs:
  host:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy safetensors 'transformers>=4.40,<5' torch
      - run: cmake -S . -B build -DLLM_CUDA=OFF -DCMAKE_BUILD_TYPE=Debug -DLLM_SANITIZE=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
  cuda-compile:
    runs-on: ubuntu-22.04
    container: nvidia/cuda:12.6.3-devel-ubuntu22.04
    steps:
      - run: apt-get update && apt-get install -y git build-essential python3-pip
      - uses: actions/checkout@v4
      - run: python3 -m pip install 'cmake>=3.24,<4'
      - run: cmake -S . -B build -DLLM_CUDA=ON -DCMAKE_BUILD_TYPE=Release
      - name: Compile CUDA and publish failure diagnostics
        shell: bash
        run: |
          set +e
          cmake --build build --parallel 2 2>&1 | tee cuda-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python3 - <<'PYDIAGNOSTICS'
          from pathlib import Path
          text = Path('cuda-build.log').read_text(errors='replace')[-14000:]
          for start in range(0, len(text), 3000):
              escaped = text[start:start+3000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=CUDA compiler diagnostics::' + escaped)
          PYDIAGNOSTICS
          fi
          exit "$status"
      # Standard hosted runners do not expose NVIDIA GPUs. No runtime pass is claimed.
